<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/MainLayout}">
<body>
<div layout:fragment="content">
  <h2 class="mb-3">Add Product</h2>
  <form th:action="@{/products}" th:object="${product}" method="post">
    <div class="mb-3">
      <label for="name" class="form-label">Product Name</label>
      <input type="text" id="name" th:field="*{name}" class="form-control"
             th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>


    <div class="mb-3">
      <label for="price" class="form-label">Price</label>
      <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control"
             th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
      <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>


    <div class="mb-3">
      <label for="category" class="form-label">Category</label>
      <select id="category" th:field="*{category}" class="form-select"
              th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
        <option value="" disabled selected>Select Category</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>


      <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
    </div>


    <button type="submit" class="btn btn-success">Save</button>
    <a href="/products" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>
