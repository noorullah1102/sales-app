<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Live Product Search</title>

  <style>
    #loader {
        display: none;
        margin: 10px 0;
    }
    #loader img {
        width: 30px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }
    th, td {
        padding: 8px;
        border: 1px solid #ddd;
    }
    th {
        background: #f5f5f5;
    }
  </style>

  <script>
    function searchProducts() {
        const query = document.getElementById("searchInput").value;
        const loader = document.getElementById("loader");
        const tbody = document.getElementById("results");

        if (query.length === 0) {
            tbody.innerHTML = ""; // Clear results if input is empty
            return;
        }

        loader.style.display = "block";

        fetch("/api/products/search?query=" + encodeURIComponent(query))
            .then(response => {
                if (!response.ok) throw new Error("Search failed");
                return response.json();
            })
            .then(data => {
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">No products found</td></tr>`;
                    return;
                }

                data.forEach(p => {
                    const row = `<tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.price}</td>
                    </tr>`;
                    tbody.insertAdjacentHTML("beforeend", row);
                });
            })
            .catch(err => {
                alert("Error: " + err.message);
                tbody.innerHTML = "";
            })
            .finally(() => {
                loader.style.display = "none";
            });
    }
  </script>
</head>
<body>

<h2>Live Product Search</h2>

<input type="text" id="searchInput" placeholder="Type product name..." onkeyup="searchProducts()" />

<div id="loader"><img src="/images/testing.gif" alt="Loading..."></div>

<table>
  <thead>
  <tr>
    <th>ID</th><th>Name</th><th>Price</th>
  </tr>
  </thead>
  <tbody id="results">
  <!-- AJAX results go here -->
  </tbody>
</table>

</body>
</html>
