<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Sales App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">


<!-- Header with Responsive Navbar -->
<header class="mb-4 shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sales App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                    <!-- Customers Menu -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="customerDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            Customers
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="customerDropdown">
                            <li><a class="dropdown-item" href="/customers">View Customers</a></li>
                            <li><a class="dropdown-item" href="/customers/new">Add Customer</a></li>
                        </ul>
                    </li>


                    <!-- Categories Menu -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="categoryDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            Categories
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="categoryDropdown">
                            <li><a class="dropdown-item" href="/category">View Categories</a></li>
                            <li><a class="dropdown-item" href="/category/new">Add Category</a></li>
                        </ul>
                    </li>


                    <!-- Products Menu -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="productDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            Products
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="productDropdown">
                            <li><a class="dropdown-item" href="/products">View Products</a></li>
                            <li><a class="dropdown-item" href="/products/create">Add Product</a></li>
                        </ul>
                    </li>


                    <!-- Sales Menu -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="salesDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            Sales
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="salesDropdown">
                            <li><a class="dropdown-item" href="/sales">View Sales</a></li>
                            <li><a class="dropdown-item" href="/sales/create">Create Sale</a></li>
                        </ul>
                    </li>


                </ul>
            </div>
        </div>
    </nav>
</header>


<!-- Main Content Area -->
<main layout:fragment="content" class="container flex-fill mb-4">
    <!-- Dynamic view content -->
</main>


<!-- Footer -->
<footer class="bg-light text-center py-3 mt-auto border-top">
    <div class="container">
        <p class="mb-0 text-muted small">© 2025 Sales App</p>
    </div>
</footer>


<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<div layout:fragment="pageScripts"></div>
</body>
</html>
